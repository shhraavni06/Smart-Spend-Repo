<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goals | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">Save with purpose</span><h1>Savings goals</h1><p>Create a target and watch your progress grow.</p></div><section class="panel glass"><form id="f" class="form-grid"><input id="goalName" placeholder="Goal name e.g. New laptop" required><input id="target" type="number" min="1" placeholder="Target ₹" required><input id="saved" type="number" min="0" value="0" placeholder="Already saved ₹"><input id="deadline" type="date"><button class="btn">+ Add goal</button></form></section><section id="list" class="goal-grid"></section></main><script src="/js/app.js"></script><script>
const u=guardUser();renderNav();async function load(){const r=await api("/api/goals/"+u.id),xs=await r.json();list.innerHTML=xs.map(x=>{const p=Math.min(100,x.targetAmount?x.savedAmount/x.targetAmount*100:0);return `<article class="goal glass"><h3>${x.name}</h3><div class="goal-money">${money(x.savedAmount)} <small class="muted">of ${money(x.targetAmount)}</small></div><div class="progress"><span style="width:${p}%"></span></div><p class="muted">${p.toFixed(0)}% complete${x.deadline?" · Deadline "+x.deadline:""}</p></article>`}).join("")||'<div class="glass panel"><p class="muted">No goals yet. Create your first savings goal!</p></div>'}f.onsubmit=async e=>{e.preventDefault();await api("/api/goals","POST",{userId:u.id,name:goalName.value,targetAmount:Number(target.value),savedAmount:Number(saved.value),deadline:deadline.value});f.reset();saved.value=0;load()};load();
</script></body></html>
