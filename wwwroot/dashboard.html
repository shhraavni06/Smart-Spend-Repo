<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">Personal dashboard</span><h1>Hello, <span id="name"></span> 👋</h1><p>Here's a simple view of your spending today.</p></div><section class="kpis"><div class="kpi glass"><small>Total spent</small><b id="total">₹0</b></div><div class="kpi glass"><small>Transactions</small><b id="count">0</b></div><div class="kpi glass"><small>Top category</small><b id="top">—</b></div><div class="kpi glass"><small>Goals</small><b id="goalCount">0</b></div></section><div class="layout2"><section class="panel glass"><div class="panel-head"><h2>Recent expenses</h2><a href="/expenses.html">See all</a></div><div id="recent"></div></section><section class="panel glass"><span class="pill">✦ AI Adviser</span><h2>Not sure where your money is going?</h2><p class="muted">Ask SmartSpend to analyse your recorded spending.</p><a class="btn" href="/advisor.html">Ask AI →</a></section></div></main><script src="/js/app.js"></script><script>
const u=guardUser();renderNav();if(u){name.textContent=u.fullName.split(" ")[0];(async()=>{const [a,e,g]=await Promise.all([api("/api/analytics/"+u.id),api("/api/expenses/"+u.id),api("/api/goals/"+u.id)]);const ad=await a.json(),ex=await e.json(),go=await g.json();total.textContent=money(ad.total);count.textContent=ad.count;top.textContent=ad.categories[0]?.category||"—";goalCount.textContent=go.length;recent.innerHTML=ex.slice(0,5).map(x=>`<div class="row"><span><b>${x.title}</b><small>${x.category} · ${x.expenseDate}</small></span><strong>${money(x.amount)}</strong></div>`).join("")||"<p class='muted'>No expenses yet. Add your first one!</p>"})()}
</script></body></html>
