<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Adviser | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">✦ AI + your data</span><h1>SmartSpend AI Adviser</h1><p>Ask questions about your recorded spending.</p></div><section class="panel glass"><div id="chat" class="chat"><div class="bubble ai">Hi! 👋 Ask me where you're spending the most, how to reduce expenses, or how to plan your budget.</div></div><form id="f" class="chat-form"><input id="question" placeholder="e.g. Where can I save money?" required><button class="btn">Ask AI</button></form></section></main><script src="/js/app.js"></script><script>
const u=guardUser();renderNav();f.onsubmit=async e=>{e.preventDefault();const q=question.value;chat.innerHTML+=`<div class="bubble user">${q}</div>`;question.value="";chat.innerHTML+=`<div id="thinking" class="bubble ai">Thinking…</div>`;const r=await api("/api/advisor","POST",{userId:u.id,question:q});const d=await r.json();thinking.outerHTML=`<div class="bubble ai"><small>${d.source}</small><br>${d.answer.replace(/\n/g,"<br>")}</div>`};
</script></body></html>
