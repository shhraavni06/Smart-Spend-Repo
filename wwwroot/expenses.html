<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">Track spending</span><h1>Expenses</h1><p>Add an expense whenever you spend money.</p></div><section class="panel glass"><form id="f" class="form-grid"><input id="title" placeholder="What did you spend on?" required><select id="category"><option>Food</option><option>Transport</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Health</option><option>Other</option></select><input id="amount" type="number" min="1" step=".01" placeholder="Amount ₹" required><input id="date" type="date" required><input id="notes" placeholder="Optional note"><button class="btn">+ Add expense</button></form></section><section class="panel glass"><div id="list"></div></section></main><script src="/js/app.js"></script><script>
const u=guardUser();renderNav();date.value=new Date().toISOString().slice(0,10);async function load(){const r=await api("/api/expenses/"+u.id),xs=await r.json();list.innerHTML=xs.map(x=>`<div class="row"><span><b>${x.title}</b><small>${x.category} · ${x.expenseDate}${x.notes?" · "+x.notes:""}</small></span><strong>${money(x.amount)} <button onclick="del(${x.id})" style="background:none;border:0;color:var(--danger);cursor:pointer">×</button></strong></div>`).join("")||"<p class='muted'>No expenses yet.</p>"}async function del(id){await api("/api/expenses/"+id,"DELETE");load()}f.onsubmit=async e=>{e.preventDefault();await api("/api/expenses","POST",{userId:u.id,title:title.value,category:category.value,amount:Number(amount.value),expenseDate:date.value,notes:notes.value});f.reset();date.value=new Date().toISOString().slice(0,10);load()};load();
</script></body></html>
