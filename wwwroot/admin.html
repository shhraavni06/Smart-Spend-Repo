<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">🛡️ Admin console</span><h1>SmartSpend users</h1><p>Manage and review registered accounts.</p></div><section class="panel glass"><div id="message" class="message"></div><div id="users"></div></section></main><script src="/js/app.js"></script><script>
const u=guardAdmin();renderNav();if(u)(async()=>{const r=await api("/api/admin/users?adminId="+u.id);if(!r.ok){message.textContent="Admin access required.";return}const xs=await r.json();users.innerHTML='<div class="table"><div class="thead"><b>ID</b><b>Username</b><b>Name</b><b>Email</b><b>Role</b></div>'+xs.map(x=>`<div class="trow"><span>${x.id}</span><span>${x.username}</span><span>${x.fullName}</span><span>${x.email}</span><span>${x.role}</span></div>`).join("")+"</div>"})()
</script></body></html>
