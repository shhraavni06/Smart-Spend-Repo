<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><main class="auth-shell glass"><section class="auth-side"><a class="brand" href="/">Smart<i>Spend</i></a><h1>Start your smarter money journey.</h1><p>Create your own student account and begin tracking your money in minutes.</p></section><section class="auth-form"><span class="pill">Free student account</span><h2>Create account</h2><p>Use simple details you'll remember.</p><form id="form"><label>Full name<input id="fullName" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Username<input id="username" required minlength="3" placeholder="Choose a username"></label><label>Password<div class="password-wrap"><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"><button type="button" class="show-pass" onclick="toggle()">Show</button></div></label><button class="btn">Create my account →</button></form><div id="message" class="message"></div><p class="muted">Already have an account? <a style="color:var(--cyan)" href="/login.html">Sign in</a></p></section></main><script>
function toggle(){password.type=password.type==="password"?"text":"password"}form.onsubmit=async e=>{e.preventDefault();message.textContent="Creating your account…";const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:fullName.value,email:email.value,username:username.value,password:password.value})});const d=await r.json();message.textContent=d.message;if(r.ok){setTimeout(()=>location.href="/login.html",900)}};
</script></body></html>
