<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">Understand your habits</span><h1>Spending analytics</h1><p>Filter your expenses and see which categories cost you the most.</p></div><section class="panel glass"><div class="filters"><select id="cat"><option value="">All categories</option><option>Food</option><option>Transport</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Health</option><option>Other</option></select><input id="from" type="date"><input id="to" type="date"><button class="btn" onclick="load()">Apply filters</button></div></section><section class="kpis" style="margin-top:16px"><div class="kpi glass"><small>Filtered spend</small><b id="total">₹0</b></div><div class="kpi glass"><small>Transactions</small><b id="count">0</b></div></section><section class="panel glass"><h2>Category breakdown</h2><div id="bars" class="bars"></div></section></main><script src="/js/app.js"></script><script>
const u=guardUser();renderNav();async function load(){const r=await api(`/api/analytics/${u.id}?category=${encodeURIComponent(cat.value)}&from=${from.value}&to=${to.value}`),d=await r.json();total.textContent=money(d.total);count.textContent=d.count;bars.innerHTML=d.categories.map(x=>`<div class="bar"><span>${x.category}</span><div><i style="width:${d.total?x.total/d.total*100:0}%"></i></div><b>${money(x.total)}</b></div>`).join("")||"<p class='muted'>No data matches these filters.</p>"}load();
</script></body></html>
