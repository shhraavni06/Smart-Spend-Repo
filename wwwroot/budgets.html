<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budgets | SmartSpend</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="appNav"></div><main class="container"><div class="page-head"><span class="pill">Plan ahead</span><h1>Budgets</h1><p>Set spending limits for each category.</p></div><section class="panel glass"><form id="f" class="form-grid"><select id="category"><option>Food</option><option>Transport</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Health</option><option>Other</option></select><input id="amount" type="number" min="1" step=".01" placeholder="Monthly budget ₹" required><input id="month" type="month" required><span></span><button class="btn">+ Save budget</button></form></section><section class="panel glass"><div id="list"></div></section></main><script src="/js/app.js"></script><script>
const u=guardUser();renderNav();month.value=new Date().toISOString().slice(0,7);async function load(){const r=await api("/api/budgets/"+u.id),xs=await r.json();list.innerHTML=xs.map(x=>`<div class="row"><span><b>${x.category}</b><small>${x.monthYear}</small></span><strong>${money(x.amount)}</strong></div>`).join("")||"<p class='muted'>No budgets yet.</p>"}f.onsubmit=async e=>{e.preventDefault();await api("/api/budgets","POST",{userId:u.id,category:category.value,amount:Number(amount.value),monthYear:month.value});load()};load();
</script></body></html>
